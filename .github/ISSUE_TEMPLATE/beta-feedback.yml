name: Verseform Beta feedback
description: Report a defect, compatibility problem, accessibility issue, or daily-use friction in the Windows Beta.
title: "[Beta 0.2.0] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Verseform.

        This is a public issue. Do not attach a `.verseform` document, recovery file, scripture cache, private writing, personal information, credentials, or other sensitive data. Describe the smallest safe example that reproduces the problem.
  - type: dropdown
    id: category
    attributes:
      label: Feedback category
      options:
        - Defect or unexpected behavior
        - Daily-use friction
        - Windows compatibility
        - Accessibility
        - Scripture text or attribution
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity when it happened
      options:
        - Online with a DBS translation
        - Offline with bundled WEB
        - Transitioning between online and offline
        - Not related to scripture
        - Unsure
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the visible result without including private document content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
      description: Use invented text and the smallest sequence that reproduces the behavior.
      placeholder: |
        1. Open Verseform 0.2.0.
        2. Enter non-sensitive sample text.
        3. Choose...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: frequency
    attributes:
      label: Frequency and recovery
      description: How often does it happen, and could you continue without losing accepted writing?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private writing, a document or recovery file, cache contents, personal information, credentials, or other sensitive data.
          required: true
