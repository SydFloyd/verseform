name: Windows beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Download retained Windows Alpha
        uses: actions/download-artifact@v5
        with:
          name: verseform-0.1.0-windows-alpha
          path: artifacts/alpha
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33759181934
      - name: Install locked dependencies
        run: npm ci
      - name: Audit npm advisories
        run: npm audit --audit-level=high
      - name: Run TypeScript and pure application checks
        run: npm run typecheck && npm run test
      - name: Build production webview
        run: npm run build
      - name: Run Alpha hardening journeys
        run: npx playwright test tests/browser/alpha-hardening.spec.ts
      - name: Run Beta stabilization journeys
        run: npx playwright test tests/browser/beta-stabilization.spec.ts
      - name: Run Beta UI journeys
        run: npx playwright test tests/browser/beta-ui.spec.ts
      - name: Run editing lifecycle journeys
        run: npx playwright test tests/browser/editing-lifecycle.spec.ts
      - name: Run kernel journeys
        run: npx playwright test tests/browser/kernel.spec.ts
      - name: Run output journeys
        run: npx playwright test tests/browser/output.spec.ts
      - name: Run reference intelligence journeys
        run: npx playwright test tests/browser/reference-intelligence.spec.ts
      - name: Run refinement journeys
        run: npx playwright test tests/browser/refinement.spec.ts
      - name: Run scripture provider journeys
        run: npx playwright test tests/browser/scripture-providers.spec.ts
      - name: Run walking-slice journeys
        run: npx playwright test tests/browser/walking-slice.spec.ts
      - name: Run native and Windows checks
        run: npm run check:native
      - name: Validate release boundaries and licenses
        run: npm run audit:release
      - name: Audit Rust advisories
        run: cargo install cargo-audit --locked && cargo audit --file src-tauri/Cargo.lock
      - name: Build Beta NSIS installer
        run: npm run build:desktop
      - name: Exercise Alpha-to-Beta upgrade lifecycle
        run: npm run test:upgrade
      - name: Exercise clean installer lifecycle
        run: npm run test:installer
      - name: Record artifact evidence
        shell: pwsh
        run: |
          $installer = Resolve-Path "src-tauri/target/release/bundle/nsis/Verseform_0.2.0_x64-setup.exe"
          $evidenceDirectory = New-Item -ItemType Directory -Force -Path "artifacts/beta-release"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content -Encoding ascii -LiteralPath (Join-Path $evidenceDirectory "SHA256SUMS.txt")
          @{
            version = "0.2.0"
            commit = $env:GITHUB_SHA
            workflowRun = $env:GITHUB_RUN_ID
            runner = $env:RUNNER_NAME
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath (Join-Path $evidenceDirectory "release-evidence.json")
          "### Verseform 0.2.0 Windows Beta" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Installer SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Beta installer SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: verseform-0.2.0-windows-beta
          path: |
            src-tauri/target/release/bundle/nsis/Verseform_0.2.0_x64-setup.exe
            artifacts/beta-release/SHA256SUMS.txt
            artifacts/beta-release/release-evidence.json
          if-no-files-found: error
          retention-days: 30
