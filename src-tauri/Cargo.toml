[package]
name = "verseform"
version = "0.2.0"
description = "A local-first scripture text editor"
authors = ["Verseform"]
edition = "2024"

[lib]
name = "verseform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "1", features = ["sync", "time"] }
webview2-com = "0.38"
windows = "0.61"
windows-core = "0.61"

[dev-dependencies]
tempfile = "3"
